apiVersion: v1
kind: Service
metadata:
  name: router
  namespace: llm-router
  labels:
    app.kubernetes.io/name: router
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: router
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: router
  namespace: llm-router
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: router
