---
# nodeadm NodeConfig fragment that makes containerd and the kubelet use the
# SOCI snapshotter. nodeadm merges it with the NodeConfig generated by EKS
# (managed node groups) or Karpenter (inference nodes).
apiVersion: node.eks.aws/v1alpha1
kind: NodeConfig
spec:
  kubelet:
    config:
      # The SOCI snapshotter proxies the CRI image service so it receives
      # registry credentials for lazy loading (CRI keychain).
      imageServiceEndpoint: unix:///run/soci-snapshotter-grpc/soci-snapshotter-grpc.sock
  containerd:
    config: |
      [proxy_plugins.soci]
        type = "snapshot"
        address = "/run/soci-snapshotter-grpc/soci-snapshotter-grpc.sock"
        [proxy_plugins.soci.exports]
          root = "/var/lib/soci-snapshotter-grpc"

      [plugins."io.containerd.cri.v1.images"]
        snapshotter = "soci"
        # Required for containerd to pass lazy-loading information to SOCI.
        disable_snapshot_annotations = false
